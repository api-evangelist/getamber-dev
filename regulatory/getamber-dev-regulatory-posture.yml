probed_paths:
  note: Conventional paths probed live on ambr.run 2026-09-19 — every one a hard 404 (18,119-byte Next.js not-found page); /docs/data-residency 307s to getamber.dev/docs/data-residency which also 404s.
  misses: [/accessibility, /accessibility/vpat, /legal/subprocessors, /legal/dpa, /privacy/requests, /transparency, /trust, /security/sbom, /docs/data-residency, /ai, /ai/transparency, /legal/report-content]
signals:
  data_subject_request:
    url: https://ambr.run/privacy
    section: '6. Your Rights / 8. Contact'
    channel: privacy@ambr.run
    stated_sla: 'We will respond to all requests within 30 days.'
    rights_named: [access, rectification, erasure, portability, objection]
    evidence:
    - source: https://ambr.run/privacy
      http_status: 200
      fetched: '2026-09-19'
      dated: 'Last updated: March 11, 2026'
      quote: >-
        "Under GDPR, you have the right to: Access ... Rectification ... Erasure: Request deletion of your
        data. For contracts, this means the human-readable text and principal declaration will be replaced
        with "[REDACTED]". The SHA-256 hash is preserved to maintain chain integrity ... Portability: Export
        your contracts in JSON, Markdown, or plain text format via the API or Reader Portal. Objection ...
        We will respond to all requests within 30 days." / "For privacy-related inquiries, data access
        requests, or erasure requests, contact us at privacy@ambr.run."
    note: >-
      A documented request process with a named channel, a response period and a stated erasure mechanism
      specific to the product (redaction that preserves the hash chain). It is a section of the privacy
      policy, not a dedicated intake page (/privacy/requests 404), and no DSR API endpoint is documented.
  ai_transparency:
    url: https://ambr.run/terms
    section: '3. Not Legal Advice / 4. AI-Generated Content'
    evidence:
    - source: https://ambr.run/terms
      http_status: 200
      fetched: '2026-09-19'
      dated: 'Last updated: April 8, 2026'
      quote: >-
        "Contracts generated by Ambr are produced by artificial intelligence from template structures
        informed by legal research. Generated contracts have NOT been reviewed by an attorney." /
        "Contracts are generated using large language models. ... AI-generated output may contain errors,
        omissions, or inaccuracies. You are solely responsible for reviewing all generated contracts
        before use."
    - source: https://ambr.run/privacy
      http_status: 200
      quote: 'Contract data is processed using Anthropic''s Claude API for AI-generated contract text — Anthropic does not retain API inputs/outputs for training purposes.'
    note: >-
      A published, contractual disclosure that the product's output is AI-generated, naming the model
      provider, carried in the Terms and Privacy Policy rather than on a dedicated /ai page (/ai and
      /ai/transparency 404). The A2C consumer templates additionally carry an agent_disclosure parameter,
      and the repo's discovery notes describe them as EU AI Act Art. 50-framed, but that is template
      content, not a page — only the Terms statement is credited here.
  exit_assistance:
    url: https://ambr.run/privacy
    section: '6. Your Rights — Portability'
    evidence:
    - source: https://ambr.run/privacy
      http_status: 200
      fetched: '2026-09-19'
      quote: 'Portability: Export your contracts in JSON, Markdown, or plain text format via the API or Reader Portal.'
    - source: https://github.com/getambr/ambr/blob/master/open-source/reader-portal/README.md
      http_status: 200
      quote: 'contract viewer with human/machine toggle, SHA-256 hash verification, and export (JSON, Markdown, text)'
    note: >-
      Export/portability of the customer's own data in three open formats via API and portal, and an
      MIT-licensed reader that verifies exported contracts independently of Ambr (the spec page: "requires
      no trust in Ambr as an intermediary"). Recorded as the portability half of exit assistance; there is
      no switching/termination-assistance page and no stated exit period.
