- aid: getamber-dev:ambr-mcp-server
  name: Ambr MCP Server
  description: >-
    One remote Model Context Protocol server at https://getamber.dev/api/mcp — Streamable HTTP in
    stateless JSON mode, protocol version 2025-03-26, serverInfo ambr-mcp-server 1.0.0. Anonymous
    initialize and tools/list return six tools with real inputSchemas and annotations:
    ambr_list_templates, ambr_create_contract, ambr_get_contract, ambr_get_contract_status,
    ambr_verify_hash, ambr_agent_handshake. Read-only tools run without a credential; state-changing
    tools take an X-API-Key header or answer with an x402 v2 payment challenge. No stdio package exists.
    A server.json in the official registry schema sits in the getambr/ambr repository; Glama lists the
    connector as healthy.
  image: https://ambr.run/logo.png
  humanURL: https://getamber.dev/docs
  baseURL: https://getamber.dev/api/mcp
