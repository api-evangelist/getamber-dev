  note: getamber.dev/ 307s to ambr.run/; the API, MCP, A2A, docs, dashboard and agent card all live on getamber.dev, the marketing site and legal pages on ambr.run. Both are Ambr (agent card provider.url, llms.txt, README). The slug follows the domain the harvest recorded.
