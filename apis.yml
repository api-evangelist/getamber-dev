apis:
- aid: getamber-dev:ambr-rest-api
  name: Ambr REST API
  description: >-
    JSON REST API at https://getamber.dev/api/v1 for the full mandate lifecycle: list templates (public),
    create a contract from a template (X-API-Key with credits, or x402 pay-per-contract), share it by
    reader URL, handshake (accept / reject / request changes), sign with an ECDSA wallet signature, read
    a contract by id / hash / UUID (metadata public, full text with key or share token), a public
    validity check (is_currently_valid, is_expired, revoked_at), revoke (terminal, cascades to child
    delegations), issue API keys, register delegations, verify ZK identity, and wallet-auth flows. A
    public pricing endpoint (/api/v1/pricing) is the canonical price source and /api/health is a public
    readiness probe. No OpenAPI is published; the reference is https://getamber.dev/docs (endpoint
    table) and https://getamber.dev/developers (snippets, errors, rate limits).
  image: https://ambr.run/logo.png
  humanURL: https://getamber.dev/docs
  baseURL: https://getamber.dev/api/v1
