- aid: getamber-dev:ambr-a2a-agent
  name: Ambr A2A Agent
  description: >-
    Agent-to-Agent JSON-RPC endpoint at https://getamber.dev/api/a2a implementing message/send,
    tasks/get and tasks/cancel (tasks are processed synchronously), discovered through an agent card
    served at /.well-known/agent-card.json and the legacy /.well-known/agent.json on both getamber.dev
    and ambr.run. The card declares six skills (create_contract, list_templates, get_contract,
    verify_hash, get_status, agent_handshake), apiKey and x402 security schemes, an MCP additional
    interface, a live pricing source and compliesWith urn:ambr:ricardian-v1; it is graded flavored
    against A2A 1.0.0 because it carries no top-level protocolVersion.
  image: https://ambr.run/logo.png
  humanURL: https://getamber.dev/docs
  baseURL: https://getamber.dev/api/a2a
  tags:
  - A2A
  - agent-native
  - AI Agents
  properties:
  - type: AgentCard
    url: a2a/getamber-dev-a2a.yml
  - type: AgentCard
    url: https://getamber.dev/.well-known/agent-card.json
