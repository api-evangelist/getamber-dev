  host: getamber.dev
  note: >-
    Ambr serves the SAME 6,696-byte card at four URLs: the canonical /.well-known/agent-card.json and the
    legacy /.well-known/agent.json on both getamber.dev (the platform/API host) and ambr.run (the
    marketing host; getamber.dev/ itself 307s to ambr.run/). Ownership is not in question: the card's
    provider.organization is "Ambr" with provider.url https://ambr.run, its url is the A2A endpoint on
    getamber.dev, Ambr's own llms.txt, README (github.com/getambr/ambr), docs page and MCP server.json all
    name this exact URL as the agent card, and the A2A endpoint's own GET response lists both well-known
    paths under agent_card. Harvest provenance: this company entered the catalog from an a2a-registry
    listing (x-source: harvest:a2a-registry), and the card is the surface that listing pointed at.
