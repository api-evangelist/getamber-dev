status_page_notes: >-
  A first-party public status page (added in 0.3.3, 2026-04-23) that polls https://getamber.dev/api/health
  every 30 seconds and renders per-service dots for seven dependencies. The health endpoint itself is
  public JSON: observed 2026-09-19 {"status":"healthy","version":"0.3.4","services":{"supabase":"ok",
  "base_rpc":"ok","anthropic":"ok","ops_agent":"ok","resend":"ok","stripe":"ok","cnft_contract":"ok"},
  "cnft":{"address":"0x20cEE8DdeB9b700dA6f9E00cD6A430Fb351DB250"}}. There is no incident history, no
  subscription and no third-party status host (status.ambr.run and status.getamber.dev do not resolve).
