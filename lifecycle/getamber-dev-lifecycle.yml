object_lifecycle:
  note: >-
    Distinct from API lifecycle — the documented state machine of the Contract object, recorded here
    because agents must read it before acting (developers page, "Mandate Lifecycle").
  states: [draft, awaiting_principal_approval, handshake, pending_signature, active, amended, revoked, expired, terminated]
  terminal: [amended, revoked, terminated]
  transitions:
  - 'POST /contracts -> draft'
  - 'handshake accept -> draft -> pending_signature (request_changes keeps draft)'
  - 'first ECDSA signature -> pending_signature; second -> active (one-sided P2 template: single signature -> active)'
  - 'child contract above parent oversight_threshold_usd -> awaiting_principal_approval until a human signs (EU AI Act Art. 14 framing)'
  - 'POST /contracts/:id/revoke -> revoked (irreversible; cascades to child delegations)'
  - 'expiry is derived: past expiry_date the status column may still read active, but GET /:id/status returns is_currently_valid false and is_expired true'
