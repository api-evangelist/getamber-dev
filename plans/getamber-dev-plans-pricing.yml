description: >-
  Ambr publishes its price list as a MACHINE-READABLE endpoint — GET https://getamber.dev/api/v1/pricing,
  anonymous, application/json, CORS * — and its agent card, llms.txt and MCP server.json all point agents
  at it as the canonical price source ("Do not hardcode prices"). The raw response fetched 2026-09-19 is
  saved verbatim at plans/getamber-dev-pricing.json. Pricing is per contract ("mandate") in USD, in four
  tiers keyed to template category, with three ways to pay: (a) credits on an API key — free Developer
  credits, one-time credit packs, or a monthly subscription, all via getamber.dev/activate (Stripe card
  checkout or USDC on Base); (b) x402 pay-per-contract at call time (USDC and six other tokens on Base
  L2, HTTP 402 challenge then retry with X-Payment tx hash); (c) an Enterprise tier priced on request.
  Handshake, sign, verify and Reader access are free; cNFT minting gas is absorbed. A ten-slot Founding
  Partner programme offers 1,000 free contracts and a permanent 50% per-contract discount (0/10 claimed
  at fetch time). Terms §6: credit packs are one-time and non-refundable once the key is shown except
  within 14 days with no contracts created; on-chain and x402 settlements are final.
